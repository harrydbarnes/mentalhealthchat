<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Chat</h1>
        <!-- TODO: Display who the user is chatting with (e.g., "Chatting with Ally John" or "Chatting with User (Anonymous)") -->
    </header>
    <main>
        <div id="chatWindow">
            <div id="messagesArea">
                <!-- Messages will appear here -->
                <!-- Example: <p class="message"><strong>User:</strong> Hello!</p> -->
                <!-- Example: <p class="message"><strong>Ally:</strong> Hi there! How can I help?</p> -->
            </div>
            <div id="inputArea">
                <input type="text" id="messageInput" placeholder="Type your message...">
                <button id="sendMessageBtn">Send</button>
            </div>
        </div>
        <!-- TODO: Add "End Chat" functionality -->
    </main>
    <footer>
        <p>&copy; 2023 Mental Health Support</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
